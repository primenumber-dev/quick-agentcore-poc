openapi: "3.0.1"
info:
  title: "quick-mcp-poc-metadata"
  version: "0.0.2"
# OAuth 発見メタデータ(静的 mock 統合)。docs/19-weekly-verification-plan-week5.md §2.4-a の方針:
# - issuer は API Gateway ファサード(well-known 構築元と一致、RFC 8414 §3.3)。トークンの iss は Cognito
#   のため不一致だが、MCP クライアントはアクセストークンを検証しないので実害なし。jwks_uri は Cognito の
#   JWKS を指す(8414-03)。
# - scopes_supported に invoke スコープを含める(8414-04 / 9728-03)。Claude は PRM の scopes_supported を
#   要求 scope に使う。
paths:
  /.well-known/oauth-protected-resource/mcp:
    get:
      responses:
        "200":
          description: "200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: '{"statusCode":200}'
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: |
                {
                  "resource": "${RESOURCE_SERVER_IDENTIFIER}",
                  "resource_name": "quick-mcp-poc MCP server",
                  "authorization_servers": ["${API_GW_FRONT_BASE_URL}"],
                  "scopes_supported": ["openid", "${RESOURCE_SERVER_IDENTIFIER}/invoke"],
                  "bearer_methods_supported": ["header"]
                }
        passthroughBehavior: "when_no_match"

  # 9728-06: パス無しのルート PRM。Claude はパス付き → ルートの順にプローブする。
  /.well-known/oauth-protected-resource:
    get:
      responses:
        "200":
          description: "200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: '{"statusCode":200}'
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: |
                {
                  "resource": "${RESOURCE_SERVER_IDENTIFIER}",
                  "resource_name": "quick-mcp-poc MCP server",
                  "authorization_servers": ["${API_GW_FRONT_BASE_URL}"],
                  "scopes_supported": ["openid", "${RESOURCE_SERVER_IDENTIFIER}/invoke"],
                  "bearer_methods_supported": ["header"]
                }
        passthroughBehavior: "when_no_match"

  /.well-known/oauth-authorization-server:
    get:
      responses:
        "200":
          description: "200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: '{"statusCode":200}'
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: |
                ${AS_METADATA_JSON}
        passthroughBehavior: "when_no_match"

  # 8414-10: OpenID Connect Discovery 形式のミラー(MCP クライアントの第2フォールバック)
  /.well-known/openid-configuration:
    get:
      responses:
        "200":
          description: "200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: '{"statusCode":200}'
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: |
                ${AS_METADATA_JSON}
        passthroughBehavior: "when_no_match"

components:
  schemas:
    Empty:
      title: "Empty Schema"
      type: "object"
